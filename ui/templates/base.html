<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación Sigatoka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🍌%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='estacion.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="barra">
  <div class="marca">🍌 Estación Sigatoka</div>
  <nav>
    <a href="/mapa" class="{{ 'activa' if pagina == 'mapa' }}">🗺️ Mapa</a>
    <a href="/revisar" class="{{ 'activa' if pagina == 'revisar' }}">✅ Revisar</a>
    <a href="/galeria" class="{{ 'activa' if pagina == 'galeria' }}">🖼️ Fotos</a>
    <a href="/importar" class="{{ 'activa' if pagina == 'importar' }}">📥 Importar vuelo</a>
    <a href="/modelo" class="{{ 'activa' if pagina == 'modelo' }}">🧠 Modelo</a>
  </nav>
</header>
<div id="aviso-modelo" class="aviso oculto"></div>
<main class="{% block clase_main %}{% endblock %}">
{% block contenido %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='estacion.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
