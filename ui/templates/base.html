<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Estación Sigatoka{% endblock %}</title>
<meta name="theme-color" content="#0f171d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f171d'/%3E%3Cpath d='M6 12V6h6M20 6h6v6M26 20v6h-6M12 26H6v-6' fill='none' stroke='%23eaf0f4' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff5a6e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='estacion.css') }}">
</head>
<body class="{% if pagina != 'mapa' %}con-hoja{% endif %}">
<div id="mapa-base" aria-label="Mapa del cultivo"></div>
<div class="velo-mapa"></div>

<header class="barra-sup">
  <a class="pastilla" href="/" aria-label="Estación Sigatoka, ir a Cargar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/><circle cx="12" cy="12" r="2.5" fill="#ff5a6e" stroke="none"/></svg>
    <span class="marca-nombre">Estación Sigatoka</span>
  </a>
  {% block barra_centro %}{% endblock %}
  <span class="espacio"></span>
</header>

<nav class="riel" aria-label="Secciones">
  <a href="/" {% if pagina == "cargar" %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4h16v-4"/></svg>Cargar</a>
  <a href="/revisar" {% if pagina == "revisar" %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>Revisar
    <span class="insignia oculto" id="pendientes-nav" title="Imágenes sin revisar"></span></a>
  <a href="/modelo" {% if pagina == "modelo" %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span id="version-nav">Modelo</span></a>
  <a href="/mapa" {% if pagina == "mapa" %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2Z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</a>
</nav>

<div id="aviso-modelo" class="aviso oculto" role="status"></div>

{% block contenido %}{% endblock %}

<script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='estacion.js') }}"></script>
<script src="{{ url_for('static', filename='mapa.js') }}"></script>
<script>
  // Todas las páginas esperan este resumen; las que no son el mapa lo dejan atenuado detrás.
  const LISTO = cargarResumen();
  {% if pagina != "mapa" %}
  LISTO.then(() => { Mapa.iniciar(false); return Mapa.cargar(vueloActual(), { tl: [40, 40], br: [40, 40] }); }).catch(() => {});
  {% endif %}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
